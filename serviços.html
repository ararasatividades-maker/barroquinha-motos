<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Barroquinha Motos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">
    
    <!-- Header Simples com Voltar -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-gray-300 hover:text-white">
                <i class="fas fa-arrow-left mr-2"></i> Voltar
            </a>
            <h1 class="text-xl font-bold">Tabela de Serviços</h1>
            <div class="w-16"></div>
        </div>
    </header>

    <!-- Tabela de Serviços -->
    <div class="max-w-5xl mx-auto px-6 py-12">
        <div class="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-700">
                    <tr>
                        <th class="text-left px-6 py-4">Serviço</th>
                        <th class="text-left px-6 py-4">Descrição</th>
                        <th class="text-right px-6 py-4">Valor</th>
                        <th class="text-center px-6 py-4">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- SERVIÇO 1 -->
                    <tr class="border-t border-gray-700 hover:bg-gray-750">
                        <td class="px-6 py-4 font-semibold">Revisão Completa</td>
                        <td class="px-6 py-4 text-gray-400">Troca óleo, filtros, vela, freios</td>
                        <td class="px-6 py-4 text-right text-green-400 font-bold">R$ 150</td>
                        <td class="px-6 py-4 text-center">
                            <a href="https://wa.me/5585999999999?text=Olá! Quero agendar Revisão Completa" target="_blank" 
                               class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                                <i class="fab fa-whatsapp"></i> Agendar
                            </a>
                        </td>
                    </tr>
                    
                    <!-- SERVIÇO 2 -->
                    <tr class="border-t border-gray-700 hover:bg-gray-750">
                        <td class="px-6 py-4 font-semibold">Montagem de Motor</td>
                        <td class="px-6 py-4 text-gray-400">Completa com peças originais</td>
                        <td class="px-6 py-4 text-right text-green-400 font-bold">R$ 800</td>
                        <td class="px-6 py-4 text-center">
                            <a href="https://wa.me/5585999999999?text=Olá! Quero orçamento de Montagem de Motor" target="_blank" 
                               class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                                <i class="fab fa-whatsapp"></i> Orçar
                            </a>
                        </td>
                    </tr>

                    <!-- SERVIÇO 3 -->
                    <tr class="border-t border-gray-700 hover:bg-gray-750">
                        <td class="px-6 py-4 font-semibold">Troca de Lona</td>
                        <td class="px-6 py-4 text-gray-400">Dianteira ou traseira</td>
                        <td class="px-6 py-4 text-right text-green-400 font-bold">R$ 60</td>
                        <td class="px-6 py-4 text-center">
                            <a href="https://wa.me/5585999999999?text=Olá! Quero trocar Lona de Freio" target="_blank" 
                               class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                                <i class="fab fa-whatsapp"></i> Agendar
                            </a>
                        </td>
                    </tr>

                    <!-- SERVIÇO 4 -->
                    <tr class="border-t border-gray-700 hover:bg-gray-750">
                        <td class="px-6 py-4 font-semibold">Troca de Pastilha</td>
                        <td class="px-6 py-4 text-gray-400">Dianteira ou traseira</td>
                        <td class="px-6 py-4 text-right text-green-400 font-bold">R$ 50</td>
                        <td class="px-6 py-4 text-center">
                            <a href="https://wa.me/5585999999999?text=Olá! Quero trocar Pastilha de Freio" target="_blank" 
                               class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
                                <i class="fab fa-whatsapp"></i> Agendar
                            </a>
                        </td>
                    </tr>

                    <!-- COPIA E COLA PRA ADICIONAR MAIS SERVIÇOS -->
                    
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
